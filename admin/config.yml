# Panel de edición (Sveltia CMS) — web de Ángela García
backend:
  name: github
  repo: angelagarciamarin/web-angela-prueba
  branch: main
  base_url: https://sveltia-cms-auth.psicologa-bbf.workers.dev

site_url: https://web-angela-prueba.pages.dev
display_url: https://web-angela-prueba.pages.dev
locale: es

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  # ------------------------------------------------------------------ PÁGINAS
  - name: paginas
    label: "Páginas"
    files:
      - name: inicio
        label: "Inicio"
        file: contenido/paginas/inicio.md
        fields:
          - { label: "Plantilla (no tocar)", name: layout, widget: hidden, default: "inicio.njk" }
          - { label: "Dirección (no tocar)", name: permalink, widget: hidden, default: "/" }
          - { label: "Título para Google (SEO)", name: seo_titulo, widget: string, hint: "Aparece en la pestaña del navegador y en los resultados de Google. Ideal: menos de 60 caracteres." }
          - { label: "Descripción para Google (SEO)", name: seo_descripcion, widget: text, hint: "Resumen que puede aparecer bajo el título en Google. Ideal: unos 150 caracteres." }
          - label: "Portada"
            name: hero
            widget: object
            fields:
              - { label: "Texto pequeño sobre el título (opcional)", name: kicker, widget: string, required: false, hint: "Si lo dejas vacío, no se muestra nada." }
              - { label: "Título", name: titulo, widget: string, hint: "Rodea con *asteriscos* la palabra que quieras destacar en cursiva." }
              - { label: "Texto secundario", name: texto, widget: text }
              - { label: "Texto del botón principal", name: boton_principal, widget: string }
              - { label: "Texto del enlace secundario", name: boton_secundario, widget: string }
              - { label: "Dirección del enlace secundario", name: boton_secundario_url, widget: string }
              - { label: "Línea informativa", name: linea, widget: text }
              - { label: "Fotografía", name: foto, widget: image }
              - { label: "Descripción de la fotografía (para accesibilidad)", name: foto_alt, widget: string }
          - label: "Cómo puedo ayudarte (bloque de Inicio)"
            name: ayuda
            widget: object
            hint: "Las 7 situaciones (título, frase y dibujo) se editan en Ajustes de la web → Áreas: cómo puedo ayudarte."
            fields:
              - { label: "Título", name: titulo, widget: string, hint: "Rodea con *asteriscos* la palabra que quieras destacar." }
              - { label: "Texto introductorio", name: intro, widget: text }
              - { label: "Frase final", name: cierre, widget: text }
          - label: "Servicios"
            name: servicios
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto introductorio", name: intro, widget: text }
              - label: "Servicios"
                name: lista
                widget: list
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Nombre", name: titulo, widget: string }
                  - { label: "Descripción breve", name: frase, widget: text }
                  - { label: "Dirección del enlace", name: url, widget: string }
              - { label: "Modalidades", name: modalidades, widget: list, field: { label: "Modalidad", name: modalidad, widget: string } }
              - { label: "Frase antes de los botones", name: cierre, widget: string }
          - label: "Sobre mí"
            name: sobre
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Párrafos", name: parrafos, widget: list, field: { label: "Párrafo", name: parrafo, widget: text } }
              - { label: "Texto del enlace", name: enlace, widget: string }
              - { label: "Dirección del enlace", name: enlace_url, widget: string }
          - label: "Dónde atiendo"
            name: donde
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - label: "Lugares"
                name: lista
                widget: list
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Nombre", name: titulo, widget: string }
                  - { label: "Texto", name: texto, widget: text }
                  - { label: "Dibujo", name: icono, widget: select, options: [{ label: "Ubicación", value: pin }, { label: "Videollamada", value: video }, { label: "Casa", value: casa }] }
          - label: "Talleres infantiles (bloque de Inicio)"
            name: talleres
            widget: object
            hint: "El próximo taller se muestra solo cuando hay uno marcado como «Próximo» en la sección Talleres infantiles."
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Texto del enlace", name: enlace, widget: string }
              - { label: "Dirección del enlace", name: enlace_url, widget: string }
          - label: "Opiniones"
            name: opiniones
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Texto del enlace", name: enlace, widget: string }
          - label: "Preguntas frecuentes (bloque de Inicio)"
            name: faq
            widget: object
            hint: "Las preguntas que se muestran aquí se eligen en la sección Preguntas frecuentes (casilla «Mostrar en Inicio»)."
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto del enlace", name: enlace, widget: string }
              - { label: "Dirección del enlace", name: enlace_url, widget: string }
          - label: "Tarifas (bloque de Inicio)"
            name: tarifas
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Texto del enlace", name: enlace, widget: string }
          - label: "Cierre y contacto"
            name: cierre
            widget: object
            fields:
              - { label: "Frase de cierre", name: titulo, widget: string }

      - name: contacto
        label: "Contacto"
        file: contenido/paginas/contacto.md
        fields:
          - { label: "Plantilla (no tocar)", name: layout, widget: hidden, default: "contacto.njk" }
          - { label: "Dirección (no tocar)", name: permalink, widget: hidden, default: "/contacto/" }
          - { label: "Título para Google (SEO)", name: seo_titulo, widget: string, hint: "Aparece en la pestaña del navegador y en los resultados de Google. Ideal: menos de 60 caracteres." }
          - { label: "Descripción para Google (SEO)", name: seo_descripcion, widget: text, hint: "Ideal: unos 150 caracteres." }
          - label: "Encabezado"
            name: encabezado
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
          - label: "Canales"
            name: canales
            widget: object
            hint: "El teléfono, WhatsApp, correo y enlace de Doctoralia se cambian en Ajustes de la web → Contacto, enlaces y menú."
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto del botón de Doctoralia", name: doctoralia_boton, widget: string }
          - label: "Ubicaciones"
            name: ubicaciones
            widget: object
            hint: "Las direcciones se cambian en Ajustes de la web → Contacto, enlaces y menú."
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto del botón de cada ubicación", name: boton, widget: string }
              - { label: "Texto sobre online y domicilio", name: otras, widget: text }
              - { label: "Texto del enlace", name: enlace, widget: string }
              - { label: "Dirección del enlace", name: enlace_url, widget: string }
          - label: "Instagram"
            name: instagram
            widget: object
            fields:
              - { label: "Frase", name: texto, widget: text }
              - { label: "Nombre de usuario que se muestra", name: usuario, widget: string }

      - name: sobre_mi
        label: "Sobre mí y cómo trabajo"
        file: contenido/paginas/sobre-mi.md
        fields:
          - { label: "Plantilla (no tocar)", name: layout, widget: hidden, default: "sobre-mi.njk" }
          - { label: "Dirección (no tocar)", name: permalink, widget: hidden, default: "/sobre-mi/" }
          - { label: "Título para Google (SEO)", name: seo_titulo, widget: string, hint: "Aparece en la pestaña del navegador y en los resultados de Google. Ideal: menos de 60 caracteres." }
          - { label: "Descripción para Google (SEO)", name: seo_descripcion, widget: text, hint: "Ideal: unos 150 caracteres." }
          - label: "Presentación"
            name: presentacion
            widget: object
            hint: "La línea con la colegiada y el colegio se toma de Ajustes de la web."
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Frase destacada", name: lead, widget: text }
              - { label: "Párrafos", name: parrafos, widget: list, field: { label: "Párrafo", name: parrafo, widget: text } }
              - { label: "Fotografía (opcional)", name: foto, widget: image, required: false, hint: "Si añades una fotografía, aparecerá junto a la presentación. Si la dejas vacía, la página se muestra solo con texto." }
              - { label: "Descripción de la fotografía (para accesibilidad)", name: foto_alt, widget: string, required: false }
          - label: "Mi forma de acompañar"
            name: acompanar
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Párrafos", name: parrafos, widget: list, field: { label: "Párrafo", name: parrafo, widget: text } }
          - label: "Cómo trabajo"
            name: trabajo
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Párrafos", name: parrafos, widget: list, field: { label: "Párrafo", name: parrafo, widget: text } }
          - label: "Qué puedes esperar"
            name: esperar
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - label: "Puntos"
                name: lista
                widget: list
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Texto", name: texto, widget: text }
          - label: "Formación"
            name: formacion
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Titulaciones y formación", name: lista, widget: list, field: { label: "Titulación", name: titulacion, widget: string } }
          - label: "Experiencia y formación continua"
            name: experiencia
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Párrafos", name: parrafos, widget: list, field: { label: "Párrafo", name: parrafo, widget: text } }
              - { label: "Texto del enlace", name: enlace, widget: string }
              - { label: "Dirección del enlace", name: enlace_url, widget: string }
          - label: "Cierre"
            name: cierre
            widget: object
            fields:
              - { label: "Frase de cierre", name: titulo, widget: string }

      - name: tarifas
        label: "Tarifas"
        file: contenido/paginas/tarifas.md
        fields:
          - { label: "Plantilla (no tocar)", name: layout, widget: hidden, default: "tarifas.njk" }
          - { label: "Dirección (no tocar)", name: permalink, widget: hidden, default: "/tarifas/" }
          - { label: "Título para Google (SEO)", name: seo_titulo, widget: string, hint: "Aparece en la pestaña del navegador y en los resultados de Google. Ideal: menos de 60 caracteres." }
          - { label: "Descripción para Google (SEO)", name: seo_descripcion, widget: text, hint: "Ideal: unos 150 caracteres." }
          - label: "Encabezado"
            name: encabezado
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
          - label: "Ubicaciones y precios"
            name: sedes
            widget: list
            summary: "{{fields.nombre}}"
            hint: "Cada ubicación es una pestaña. Para cambiar un precio, abre la ubicación y edita el servicio."
            fields:
              - { label: "Identificador (no tocar)", name: id, widget: hidden }
              - { label: "Nombre de la pestaña", name: nombre, widget: string }
              - { label: "Nota bajo la pestaña (opcional)", name: nota, widget: text, required: false, hint: "En Almagro y Puertollano la dirección se añade sola desde Ajustes de la web." }
              - label: "Servicios"
                name: servicios
                widget: list
                summary: "{{fields.nombre}} · {{fields.precio}}"
                fields:
                  - { label: "Nombre del servicio", name: nombre, widget: string }
                  - { label: "Precio", name: precio, widget: string, hint: "Por ejemplo: 50€" }
                  - { label: "Duración", name: duracion, widget: string, hint: "Por ejemplo: aprox. 55 min" }
                  - { label: "Aclaración (opcional)", name: detalle, widget: text, required: false }
          - label: "Información práctica"
            name: practica
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - label: "Apartados"
                name: lista
                widget: list
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Texto", name: texto, widget: text }
          - label: "Cierre"
            name: cierre
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }

      - name: servicios
        label: "Servicios"
        file: contenido/paginas/servicios.md
        fields:
          - { label: "Plantilla (no tocar)", name: layout, widget: hidden, default: "servicios.njk" }
          - { label: "Dirección (no tocar)", name: permalink, widget: hidden, default: "/servicios/" }
          - { label: "Título para Google (SEO)", name: seo_titulo, widget: string, hint: "Aparece en la pestaña del navegador y en los resultados de Google. Ideal: menos de 60 caracteres." }
          - { label: "Descripción para Google (SEO)", name: seo_descripcion, widget: text, hint: "Ideal: unos 150 caracteres." }
          - label: "Encabezado"
            name: encabezado
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
          - label: "Servicios"
            name: lista
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Identificador (no tocar)", name: id, widget: hidden }
              - { label: "Nombre corto (para el índice de arriba)", name: corto, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Frase destacada", name: frase, widget: text }
              - { label: "Párrafos", name: parrafos, widget: list, field: { label: "Párrafo", name: parrafo, widget: text } }
              - { label: "Modalidades", name: modalidad, widget: string }
          - label: "Talleres infantiles"
            name: talleres
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Texto del enlace", name: enlace, widget: string }
              - { label: "Dirección del enlace", name: enlace_url, widget: string }
          - label: "Modalidades"
            name: modalidades
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Frases", name: lista, widget: list, field: { label: "Frase", name: frase, widget: string } }
              - { label: "Texto del enlace a Tarifas", name: enlace, widget: string }
              - { label: "Dirección del enlace", name: enlace_url, widget: string }
          - label: "Cierre"
            name: cierre
            widget: object
            fields:
              - { label: "Frase de cierre", name: titulo, widget: text }

      - name: como_puedo_ayudarte
        label: "Cómo puedo ayudarte (página completa)"
        file: contenido/paginas/como-puedo-ayudarte.md
        fields:
          - { label: "Plantilla (no tocar)", name: layout, widget: hidden, default: "ayuda.njk" }
          - { label: "Dirección (no tocar)", name: permalink, widget: hidden, default: "/como-puedo-ayudarte/" }
          - { label: "Título para Google (SEO)", name: seo_titulo, widget: string, hint: "Aparece en la pestaña del navegador y en los resultados de Google. Ideal: menos de 60 caracteres." }
          - { label: "Descripción para Google (SEO)", name: seo_descripcion, widget: text, hint: "Ideal: unos 150 caracteres." }
          - label: "Encabezado"
            name: encabezado
            widget: object
            hint: "Las 7 áreas y sus textos se editan en Ajustes de la web → Áreas: cómo puedo ayudarte."
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
          - label: "Cierre"
            name: cierre
            widget: object
            fields:
              - { label: "Frase de cierre", name: titulo, widget: text }

      - name: talleres_pagina
        label: "Talleres infantiles (página)"
        file: contenido/paginas/talleres-infantiles.md
        fields:
          - { label: "Plantilla (no tocar)", name: layout, widget: hidden, default: "talleres.njk" }
          - { label: "Dirección (no tocar)", name: permalink, widget: hidden, default: "/talleres-infantiles/" }
          - { label: "Título para Google (SEO)", name: seo_titulo, widget: string, hint: "Aparece en la pestaña del navegador y en los resultados de Google. Ideal: menos de 60 caracteres." }
          - { label: "Descripción para Google (SEO)", name: seo_descripcion, widget: text, hint: "Ideal: unos 150 caracteres." }
          - label: "Encabezado"
            name: encabezado
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
          - label: "Información general"
            name: general
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
          - label: "Información práctica"
            name: practica
            widget: object
            hint: "Edades, horarios, lugar, plazas y precio se cambian en Ajustes de la web → Talleres: datos habituales."
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto sobre la inscripción", name: inscripcion, widget: text }
              - { label: "Nota sobre condiciones habituales", name: nota, widget: text }
          - label: "Próximo taller"
            name: proximo
            widget: object
            hint: "Este bloque solo aparece cuando hay un taller marcado como «Próximo» en la sección Talleres infantiles."
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto del botón", name: boton, widget: string }
          - label: "Programación del curso"
            name: programacion
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Curso que se muestra", name: curso, widget: string, hint: "Debe coincidir con el campo «Curso» de los talleres. Ejemplo: 2026-2027" }
              - { label: "Texto", name: texto, widget: text }
          - label: "Talleres anteriores"
            name: anteriores
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Nota bajo los carteles", name: nota_cartel, widget: string }
          - label: "Cierre"
            name: cierre
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }

      - name: faq_pagina
        label: "Preguntas frecuentes (página)"
        file: contenido/paginas/preguntas-frecuentes.md
        fields:
          - { label: "Plantilla (no tocar)", name: layout, widget: hidden, default: "faq.njk" }
          - { label: "Dirección (no tocar)", name: permalink, widget: hidden, default: "/preguntas-frecuentes/" }
          - { label: "Título para Google (SEO)", name: seo_titulo, widget: string, hint: "Aparece en la pestaña del navegador y en los resultados de Google. Ideal: menos de 60 caracteres." }
          - { label: "Descripción para Google (SEO)", name: seo_descripcion, widget: text, hint: "Ideal: unos 150 caracteres." }
          - label: "Encabezado"
            name: encabezado
            widget: object
            hint: "Las preguntas y respuestas se editan en la sección Preguntas frecuentes del menú lateral. Se agrupan solas por categoría."
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
          - label: "Cierre"
            name: cierre
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }

      - name: psicologia_online
        label: "Psicología online"
        file: contenido/paginas/psicologia-online.md
        fields:
          - { label: "Plantilla (no tocar)", name: layout, widget: hidden, default: "online.njk" }
          - { label: "Dirección (no tocar)", name: permalink, widget: hidden, default: "/psicologia-online/" }
          - { label: "Título para Google (SEO)", name: seo_titulo, widget: string, hint: "Aparece en la pestaña del navegador y en los resultados de Google. Ideal: menos de 60 caracteres." }
          - { label: "Descripción para Google (SEO)", name: seo_descripcion, widget: text, hint: "Ideal: unos 150 caracteres." }
          - label: "Encabezado"
            name: encabezado
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
          - label: "Para quién es"
            name: para_quien
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Nota", name: nota, widget: text }
          - label: "Cómo funcionan las sesiones"
            name: como
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - label: "Pasos"
                name: pasos
                widget: list
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Texto", name: texto, widget: text }
          - label: "Tarifas"
            name: tarifas
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Texto del enlace", name: enlace, widget: string }
              - { label: "Dirección del enlace", name: enlace_url, widget: string }
          - label: "Cierre"
            name: cierre
            widget: object
            fields:
              - { label: "Frase de cierre", name: titulo, widget: text }

      - name: aviso_legal
        label: "Aviso legal"
        file: contenido/paginas/aviso-legal.md
        fields:
